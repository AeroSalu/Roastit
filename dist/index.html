<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roastit</title>
    <link rel="stylesheet" href="style.css">

    <!-- Existing Firebase Hosting SDK. Do not change this config. -->
    <script defer src="/__/firebase/12.17.1/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-remote-config-compat.js"></script>
    <script defer src="/__/firebase/12.17.1/firebase-performance-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
    <script defer src="app.js"></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand">
        <span class="brand-mark">R</span>
        <h1>Roastit</h1>
      </div>
      <p>Sign in to roast your profile.</p>
      <button class="btn btn-primary btn-full" id="google-login" type="button">
        Login with Google
      </button>
      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
